[project]
name = "wms2shipstation"
version = "0.1.0"
description = "Local WMS XLSX shipping label workflow"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1,<4",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "pypdf>=6,<10", "openpyxl>=3.1,<4", "python-multipart>=0.0.20,<1", "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pypdfium2>=4,<6", "pillow>=11,<13"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
