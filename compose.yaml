services:
  app:
    build: .
    ports:
      - "${WMS_BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      WMS_DATA_DIR: /data
      PORT: "8080"
      SHIPSTATION_API_KEY: ${SHIPSTATION_API_KEY:-}
      SHIPSTATION_API_SECRET: ${SHIPSTATION_API_SECRET:-}
      WMS_ENABLE_LIVE_PURCHASE: ${WMS_ENABLE_LIVE_PURCHASE:-false}
      WMS_ALLOWED_HOSTS: '${WMS_ALLOWED_HOSTS:-["localhost","127.0.0.1","testserver"]}'
    volumes:
      - app_data:/data
    restart: unless-stopped
    init: true
volumes:
  app_data:
